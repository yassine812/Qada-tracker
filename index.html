<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>قضاء - متابعة الصلوات الفائتة</title>
    <meta name="description" content="قضاء لمتابعة الصلوات والصيام والأذكار وقراءة القرآن. تُحفظ سجلاتك على جهازك ويُجهّز الاستخدام دون اتصال تلقائياً عند توفر الإنترنت." />
    <meta property="og:title" content="قضاء - متابعة الصلوات الفائتة" />
    <meta property="og:description" content="متابعة يومية وقراءة القرآن مع حفظ محلي للسجلات وتجهيز تلقائي للاستخدام دون اتصال." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA Settings -->
    <script>
      // Capture Chrome's one-shot invitation before the application bundle loads.
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__qadaInstallPrompt = event;
      });
      window.addEventListener('appinstalled', function () {
        window.__qadaInstallPrompt = null;
        window.__qadaInstalled = true;
      });
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#26352A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="قضاء" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Fonts are bundled locally by Vite for offline and native startup. -->
  </head>
  <body class="bg-[#F5F5F0] dark:bg-[#1C1D1A] text-[#2D2D2A] dark:text-[#EAE7E0] antialiased min-h-screen selection:bg-[#E8E4D9] selection:text-[#2D2D2A]">
    <!-- Apply saved theme immediately to prevent flash -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('qada_settings');
          if (raw) {
            var s = JSON.parse(raw);
            var theme = s && s.theme;
            var isDark = theme === 'dark' || (theme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
