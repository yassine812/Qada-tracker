<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6741"/>
      <stop offset="100%" stop-color="#5A7A50"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F0E8"/>
      <stop offset="100%" stop-color="#E8E0D0"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <!-- Crescent moon -->
  <circle cx="256" cy="210" r="100" fill="url(#accentGrad)"/>
  <circle cx="290" cy="185" r="85" fill="url(#bgGrad)"/>
  <!-- Small star -->
  <polygon points="340,155 348,175 368,175 352,187 358,207 340,195 322,207 328,187 312,175 332,175" fill="url(#accentGrad)" opacity="0.9"/>
  <!-- Subtle prayer arch silhouette below crescent -->
  <path d="M 180 340 Q 256 260 332 340 L 332 420 L 180 420 Z" fill="url(#accentGrad)" opacity="0.15"/>
  <!-- Checkmark indicating completion/tracking -->
  <path d="M 220 370 L 248 398 L 310 336" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
</svg>
